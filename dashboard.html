<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f2ead8;
      color: #2a1f0e;
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .floral-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #2a1f0e;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .metric {
      background: rgba(255,248,230,0.85);
      border: 0.5px solid rgba(160,120,60,0.2);
      border-radius: 8px;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .metric-label {
      font-size: 14px;
      color: #7a6040;
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 28px;
      font-weight: 500;
      color: #2a1f0e;
    }

    .metric-val.green { color: #2d7a4f; }

    .card {
      background: rgba(255,252,242,0.9);
      border: 0.5px solid rgba(160,120,60,0.2);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      backdrop-filter: blur(4px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 17px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #2a1f0e;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    input[type="text"] {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border: 0.5px solid rgba(160,120,60,0.35);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fffdf4;
      color: #2a1f0e;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: rgba(160,120,60,0.6);
      box-shadow: 0 0 0 3px rgba(160,120,60,0.1);
    }

    input[type="text"]::placeholder { color: #b09870; }

    button {
      height: 42px;
      padding: 0 18px;
      border: 0.5px solid rgba(160,120,60,0.35);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: transparent;
      color: #2a1f0e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { background: rgba(160,120,60,0.1); }
    button:active { transform: scale(0.98); }

    .filter-row { display: flex; gap: 6px; }

    .filter-btn {
      font-size: 13px;
      height: 34px;
      padding: 0 14px;
      border-radius: 99px;
    }

    .filter-btn.active {
      background: rgba(160,120,60,0.15);
      border-color: rgba(160,120,60,0.4);
      font-weight: 500;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 0.5px solid rgba(160,120,60,0.15);
      border-radius: 8px;
      background: rgba(255,252,242,0.6);
      transition: opacity 0.2s;
    }

    .task-item.done { opacity: 0.45; }
    .task-item.done .task-text { text-decoration: line-through; }

    .task-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid rgba(160,120,60,0.4);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-check.checked {
      background: #2d7a4f;
      border-color: #2d7a4f;
    }

    .task-check i { font-size: 12px; color: #fff; }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: #2a1f0e;
    }

    .task-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #c0a070;
      font-size: 17px;
      padding: 2px;
      height: auto;
    }

    .task-del:hover { color: #c0392b; background: none; }

    .progress-bar-wrap {
      height: 6px;
      background: rgba(160,120,60,0.15);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 1.25rem;
    }

    .progress-bar {
      height: 100%;
      background: #2d7a4f;
      border-radius: 99px;
      transition: width 0.3s;
    }

    .empty {
      text-align: center;
      font-size: 14px;
      color: #b09870;
      padding: 1.5rem 0;
    }
  </style>
</head>

  <div class="container">
    <h1>My Dashboard</h1>

    <div class="metric-row">
      <div class="metric">
        <div class="metric-label">Total</div>
        <div class="metric-val" id="m-total">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Done</div>
        <div class="metric-val green" id="m-done">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Remaining</div>
        <div class="metric-val" id="m-rem">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <i class="ti ti-checklist" aria-hidden="true"></i>
          My tasks
        </div>
        <div class="filter-row">
          <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
          <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
        </div>
      </div>

      <div class="input-row">
        <input type="text" id="task-input" placeholder="Add a new task..." onkeydown="if(event.key==='Enter') addTask()" />
        <button onclick="addTask()">
          <i class="ti ti-plus" aria-hidden="true"></i> Add
        </button>
      </div>

      <div class="task-list" id="task-list"></div>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'dashboard_tasks';

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [
          { id: 1, text: 'Review CBR article draft', done: false },
          { id: 2, text: 'Study contractor quoting workflow', done: false },
          { id: 3, text: 'Email Professor Xie', done: true },
        ];
      } catch { return []; }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let tasks = loadTasks();
    let nextId = tasks.length ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
    let filter = 'all';

    function setFilter(f, el) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: nextId++, text, done: false });
      input.value = '';
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    function render() {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const rem = total - done;
      document.getElementById('m-total').textContent = total;
      document.getElementById('m-done').textContent = done;
      document.getElementById('m-rem').textContent = rem;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';

      const visible = tasks.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      const list = document.getElementById('task-list');
      if (visible.length === 0) {
        list.innerHTML = '<div class="empty">No tasks here.</div>';
        return;
      }
      list.innerHTML = visible.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}">
          <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})" role="checkbox" aria-checked="${t.done}" aria-label="Mark complete">
            ${t.done ? '<i class="ti ti-check" aria-hidden="true"></i>' : ''}
          </div>
          <span class="task-text">${t.text}</span>
          <button class="task-del" onclick="deleteTask(${t.id})" aria-label="Delete task">
            <i class="ti ti-trash" aria-hidden="true"></i>
          </button>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
